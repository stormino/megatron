name: Central check

# Dry run of the Maven Central release path, without publishing anything:
# builds a throwaway version, signs it, uploads it to the Central Portal, waits for
# validation (credentials, signatures, pom metadata, javadoc/sources) and drops the deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set a throwaway version
        run: mvn -B -ntp versions:set -DgenerateBackupFiles=false -DnewVersion=0.0.0-check.${{ github.run_number }}

      - name: Upload and validate (not published)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn -B -ntp -Pcentral -DskipTests -Dcentral.autoPublish=false -Dcentral.waitUntil=validated deploy | tee deploy.log

      - name: Drop the deployment
        if: always()
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' deploy.log 2>/dev/null | tail -1 || true)
          if [ -z "$ID" ]; then
            echo "No deployment was created"
            exit 0
          fi
          TOKEN=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" \
            "https://central.sonatype.com/api/v1/publisher/deployment/$ID"
          echo "Dropped deployment $ID"
